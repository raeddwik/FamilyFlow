<body>

```
<main>

    <div class="login-card">

        <h1>FamilyFlow</h1>

        <p class="welcome">
            مرحبًا بكم في FamilyFlow
        </p>

        <form id="login-form">

            <label for="email">
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="email"
                placeholder="أدخل البريد الإلكتروني"
                required
                autocomplete="email"
            >

            <label for="password">
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                placeholder="أدخل كلمة المرور"
                required
                autocomplete="current-password"
            >

            <button
                type="submit"
                id="login-button">
                تسجيل الدخول
            </button>

        </form>

        <p id="login-message"></p>

        <p id="connection-status">
            جاري اختبار الاتصال...
        </p>

    </div>

<div id="dashboard" style="display: none;">

    <h2>لوحة تحكم FamilyFlow</h2>

    <p id="dashboard-welcome"></p>

    <p>👤 مسؤول الأسرة</p>

    <button id="family-members-button">
    👨‍👩‍👧‍👦 إدارة أفراد الأسرة
</button>
    
    <button id="logout-button">
    تسجيل الخروج
</button>
    
    <div id="family-members-section" style="display: none;">

    <h2>أفراد الأسرة</h2>

    <p>سنضيف أفراد الأسرة هنا في الخطوة التالية.</p>

</div>
</div>

</main>


<!-- Supabase JavaScript library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- FamilyFlow Supabase configuration -->
<script src="./supabase.js"></script>


<script>

    const statusElement =
        document.getElementById('connection-status');

    const loginForm =
        document.getElementById('login-form');

    const loginButton =
        document.getElementById('login-button');

    const loginMessage =
        document.getElementById('login-message');

const logoutButton =
    document.getElementById('logout-button');

logoutButton.addEventListener('click', async function () {

    await supabaseClient.auth.signOut();

    location.reload();

});
    if (typeof supabaseClient !== 'undefined') {

        statusElement.textContent =
            '✅ تم تحميل اتصال FamilyFlow بنجاح';

    } else {

        statusElement.textContent =
            '❌ حدث خطأ في تحميل Supabase';

    }


    loginForm.addEventListener('submit', async function (event) {

        event.preventDefault();

        const email =
            document.getElementById('email').value.trim();

        const password =
            document.getElementById('password').value;

        loginMessage.textContent = '';

        loginButton.disabled = true;
        loginButton.textContent = 'جاري تسجيل الدخول...';


        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {
                throw error;
            }


const { data: member, error: memberError } =
    await supabaseClient
        .from('family_members')
        .select('full_name, role, active')
        .eq('user_id', data.user.id)
        .single();

if (memberError) {
    throw memberError;
}

loginMessage.textContent =
    '✅ تم تسجيل الدخول بنجاح — مرحبًا ' + member.full_name +
    ' (' + member.role + ')';
            
document.querySelector('.login-card').style.display = 'none';

document.getElementById('dashboard').style.display = 'block';

document.getElementById('dashboard-welcome').textContent =
    'مرحبًا ' + member.full_name;
            
} catch (error) {

    console.error(error);

    loginMessage.textContent =
        '❌ حدث خطأ: ' + error.message;

} finally {

    loginButton.disabled = false;
    loginButton.textContent = 'تسجيل الدخول';

}

});

</script>
