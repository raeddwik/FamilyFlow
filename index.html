<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FamilyFlow</title>

    <meta name="theme-color" content="#315C68">

    <meta name="description"
          content="FamilyFlow — تنظيم ومتابعة أنشطة ومهام الأسرة">
</head>

<body>

    <main>

        <h1>FamilyFlow</h1>

        <p>
            مرحبًا بكم في FamilyFlow
        </p>

        <p>
            تطبيق تنظيم ومتابعة أنشطة الأسرة
        </p>

        <p id="connection-status">
            جاري اختبار الاتصال...
        </p>

    </main>


    <!-- Supabase JavaScript library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- FamilyFlow Supabase configuration -->
    <script src="./supabase.js"></script>


    <script>

        const statusElement =
            document.getElementById('connection-status');

        if (typeof supabaseClient !== 'undefined') {

            statusElement.textContent =
                '✅ تم تحميل اتصال FamilyFlow بنجاح';

        } else {

            statusElement.textContent =
                '❌ حدث خطأ في تحميل Supabase';

        }

    </script>

</body>

</html>
